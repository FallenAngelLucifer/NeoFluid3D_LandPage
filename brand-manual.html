  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <style>
    :root {
      --color-cyan: #00F0FF;
      --color-green: #39FF14;
      --color-bg: #05080B;
      --color-surface: #070D12;
      --color-surface-card: #0A121A;
      --color-border: rgba(0, 240, 255, 0.25);
      --color-border-subtle: rgba(255, 255, 255, 0.08);
      --color-text: #E6EDF3;
      --color-text-dim: #8B949E;
      --font-display: 'Clash Display', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --font-body: 'Inter', sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font-body);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .bg-grid {
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
      z-index: 0;
    }

    .bg-glow {
      position: fixed;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      filter: blur(140px);
      pointer-events: none;
      opacity: 0.15;
      z-index: 0;
    }
    .glow-cyan {
      top: -100px;
      left: 10%;
      background: var(--color-cyan);
    }
    .glow-green {
      bottom: -100px;
      right: 10%;
      background: var(--color-green);
    }

    header.manual-hud {
      position: relative;
      z-index: 10;
      height: 62px;
      min-height: 62px;
      background: rgba(4, 9, 14, 0.95);
      border-bottom: 1px solid var(--color-border);
      backdrop-filter: blur(16px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
      gap: 1rem;
    }

    .brand-back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: #FFFFFF;
      transition: opacity 0.2s ease;
    }
    .brand-back-link:hover {
      opacity: 0.85;
    }

    .brand-icon-svg {
      width: 24px;
      height: 34px;
      flex-shrink: 0;
    }

    .brand-title-wrap {
      display: flex;
      flex-direction: column;
      line-height: 0.95;
    }
    .brand-title-wrap .title-neo {
      font-family: var(--font-display);
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--color-cyan);
      text-shadow: 0 0 12px rgba(0, 240, 255, 0.5);
      letter-spacing: 0.04em;
    }
    .brand-title-wrap .title-fluid {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--color-green);
      letter-spacing: -0.02em;
    }

    .manual-doc-meta {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-family: var(--font-mono);
      font-size: 0.76rem;
    }
    .doc-pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--color-green);
      box-shadow: 0 0 10px var(--color-green);
      animation: pulseDot 2s infinite ease-in-out;
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 0.6; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    .doc-pill {
      background: rgba(0, 240, 255, 0.08);
      border: 1px solid rgba(0, 240, 255, 0.25);
      border-radius: 4px;
      padding: 0.2rem 0.6rem;
      color: var(--color-cyan);
      font-size: 0.7rem;
      letter-spacing: 0.04em;
    }

    .manual-actions {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .hud-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      font-family: var(--font-mono);
      font-size: 0.74rem;
      font-weight: 700;
      padding: 0.42rem 0.85rem;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.04);
      color: #FFFFFF;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }
    .hud-btn:hover {
      background: rgba(0, 240, 255, 0.12);
      border-color: var(--color-cyan);
      color: var(--color-cyan);
      box-shadow: 0 0 14px rgba(0, 240, 255, 0.3);
    }

    .hud-btn-download {
      border-color: rgba(57, 255, 20, 0.4);
      background: rgba(57, 255, 20, 0.08);
      color: var(--color-green);
    }
    .hud-btn-download:hover {
      background: rgba(57, 255, 20, 0.22);
      border-color: var(--color-green);
      color: #FFFFFF;
      box-shadow: 0 0 16px rgba(57, 255, 20, 0.4);
    }

    .hud-btn-back {
      border-color: rgba(0, 240, 255, 0.35);
      color: var(--color-cyan);
    }

    main.viewer-stage {
      position: relative;
      flex: 1;
      width: 100%;
      height: calc(100% - 62px - 34px);
      background: #020407;
      z-index: 1;
      display: flex;
    }

    iframe.pdf-viewport-frame {
      width: 100%;
      height: 100%;
      border: none;
      background: #020407;
      display: block;
    }

    footer.manual-footer {
      position: relative;
      z-index: 10;
      height: 34px;
      min-height: 34px;
      background: rgba(3, 6, 10, 0.98);
      border-top: 1px solid var(--color-border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--color-text-dim);
    }

    .footer-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #toast {
      position: fixed;
      bottom: 46px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      opacity: 0;
      pointer-events: none;
      background: rgba(7, 13, 18, 0.95);
      border: 1px solid var(--color-cyan);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.8), 0 0 15px rgba(0, 240, 255, 0.3);
      color: #FFFFFF;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      padding: 0.55rem 1.2rem;
      border-radius: 4px;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 9999;
    }
    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @media (max-width: 850px) {
      .manual-doc-meta { display: none; }
      .brand-title-wrap { display: none; }
    }
  </style>
</head>

    const pdfUrl = 'docs/Manual%20de%20marca%20NEO.pdf';

    function showToast(msg) {
      if (!toast) return;
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    printBtn.addEventListener('click', () => {
      if (iframe && iframe.contentWindow) {
        try {
          iframe.contentWindow.focus();
          iframe.contentWindow.print();
          showToast('Enviando documento a impresión...');
          return;
        } catch (err) {}
      }
      window.open(pdfUrl, '_blank');
      showToast('Abriendo visor para diálogo de impresión');
    });

    fullscreenBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().then(() => {
          showToast('Modo Pantalla Completa activado');
        }).catch(() => {});
      } else {
        document.exitFullscreen().then(() => {
          showToast('Pantalla Completa desactivada');
        }).catch(() => {});
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'f' || e.key === 'F') {
        fullscreenBtn.click();
      }
    });
  </script>
</body>
</html>
